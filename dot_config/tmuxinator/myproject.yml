# ~/.config/tmuxinator/myproject.yml
# Start with: tmuxinator start myproject   (or: mux myproject)

name: myproject
root: ~/

# Optional: uncomment to run commands before the session is created.
# on_project_start: echo "starting myproject"

windows:
  - editor:
      layout: main-vertical
      panes:
        - # main pane, e.g. your editor
        - # side pane, e.g. git status
  - server:
      panes:
        - # e.g. start a dev server here
  - shell:
